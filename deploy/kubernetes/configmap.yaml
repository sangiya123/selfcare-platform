# OMOBIO Kubernetes ConfigMap — Docker Desktop (local dev)
# Environment-wide defaults; per-service overrides via deployment env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: omobio-config
  namespace: omobio
data:
  SPRING_PROFILES_ACTIVE: "docker"
  X_DEFAULT_TENANT_ID: "dialog-lk"
  OMOBIO_TENANT_DEFAULT_ID: "dialog-lk"

  # MongoDB
  SPRING_DATA_MONGODB_URI: "mongodb://omobio:omobio_pw@mongodb:27017/omobio_config?authSource=admin"
  SPRING_DATA_MONGODB_HOST: "mongodb"
  SPRING_DATA_MONGODB_PORT: "27017"
  SPRING_DATA_MONGODB_DATABASE: "omobio_config"
  SPRING_DATA_MONGODB_USERNAME: "omobio"
  SPRING_DATA_MONGODB_PASSWORD: "omobio_pw"
  MONGODB_URI: "mongodb://omobio:omobio_pw@mongodb:27017/omobio_config?authSource=admin"
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  MONGO_DATABASE: "omobio_config"
  MONGO_USERNAME: "omobio"
  MONGO_PASSWORD: "omobio_pw"

  # MySQL
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/omobio_identity?useSSL=false&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "omobio"
  SPRING_DATASOURCE_PASSWORD: "omobio_pw"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"

  # Redis
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: "omobio_pw"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "omobio_pw"

  # Local development uses Hibernate to create missing service tables.
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  JPA_DDL_AUTO: "update"

  # Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

  # Tracing (no OTLP collector deployed in local cluster)
  OMOBIO_OTEL_ENABLED: "false"

  # JVM
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: omobio-infra-config
  namespace: omobio
data:
  # MongoDB init script is loaded via VolumeMount from init script
  MYSQL_DATABASE: "omobio_identity"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  ZOOKEEPER_CLIENT_PORT: "2181"
  ZOOKEEPER_TICK_TIME: "2000"
