# OMOBIO Kubernetes ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬ All 19 Microservices
# Deployments + ClusterIP Services
# Images must be built first via: ./scripts/build-images.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: omobio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: omobio
    spec:
      containers:
        - name: api-gateway
          image: omobio/api-gateway:local-v4
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: X_DEFAULT_TENANT_ID
              value: "dialog-lk"
            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: "false"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          envFrom:
            - configMapRef:
                name: omobio-config
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: omobio
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
  selector:
    app: api-gateway
---
# config-tenant-service
---
apiVersion: apps/v1
kind: Deployment
