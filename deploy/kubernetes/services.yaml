  name: config-tenant-service
  namespace: omobio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: config-tenant-service
  template:
    metadata:
      labels:
        app: config-tenant-service
        tier: omobio
    spec:
      containers:
        - name: config-tenant-service
          image: omobio/config-tenant-service:local-v2
          args:
            - "--spring.mongodb.uri=mongodb://omobio:omobio_pw@mongodb:27017/omobio_config?authSource=admin"
          ports:
