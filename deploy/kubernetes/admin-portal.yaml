# OMOBIO Selfcare Studio — Admin Portal
# Served by nginx; runtime API base URL is baked in at build time via
# VITE_API_GATEWAY_URL (points at http://localhost:30080 for Docker Desktop).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfcare-studio
  namespace: omobio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: selfcare-studio
  template:
    metadata:
      labels:
        app: selfcare-studio
        tier: omobio
    spec:
      containers:
        - name: selfcare-studio
          image: omobio/selfcare-studio:1.0.0
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: selfcare-studio
  namespace: omobio
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
  selector:
    app: selfcare-studio