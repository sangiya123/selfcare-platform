# OMOBIO Kubernetes Secrets — Docker Desktop (local dev only)
# PRODUCTION: Store these in AWS Secrets Manager / HashiCorp Vault.
# Do NOT commit real secrets here.
apiVersion: v1
kind: Secret
metadata:
  name: omobio-secrets
  namespace: omobio
type: Opaque
stringData:
  # MongoDB
  mongodb-username: "omobio"
  mongodb-password: "omobio_pw"
  mongodb-root-password: "root_pw"

  # MySQL
  mysql-root-password: "root_pw"
  mysql-password: "omobio_pw"

  # Redis
  redis-password: "omobio_pw"

  # Dialog BSS (operator integration)
  dialog-bss-client-id: "dialog-bss-dev-client"
  dialog-bss-client-secret: "dialog-bss-dev-secret-change-in-prod"

  # JWT signing keys
  jwt-secret: "omobio-local-dev-jwt-secret-256bit-change-in-prod"
  jwt-refresh-secret: "omobio-local-dev-refresh-secret-256bit-change-in-prod"

  # AI (stub key for local dev)
  ai-api-key: "stub"
