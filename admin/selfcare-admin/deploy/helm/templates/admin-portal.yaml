apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfcare-admin-portal
  namespace: {{ .Release.Namespace }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: selfcare-admin-portal
    app.kubernetes.io/part-of: selfcare-platform
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: selfcare-admin-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: selfcare-admin-portal
        app.kubernetes.io/part-of: selfcare-platform
    spec:
      serviceAccountName: selfcare-job-runner
      securityContext:
        runAsUser: 101
        runAsNonRoot: true
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      containers:
        - name: admin-portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: VITE_API_GATEWAY
              value: {{ .Values.gateway.url | quote }}
            - name: VITE_CONFIG_SERVICE
              value: {{ .Values.backendServices.config | quote }}
            - name: VITE_IDENTITY_SERVICE
              value: {{ .Values.backendServices.identity | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: selfcare-admin-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: selfcare-admin-portal
    app.kubernetes.io/part-of: selfcare-platform
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: selfcare-admin-portal
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: selfcare-admin-portal
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Release.Namespace }}-admin-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: selfcare-admin-portal
                port:
                  number: 80
{{- end }}