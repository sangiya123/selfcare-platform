apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.selfcare.selfcare"
    defaultConfig {
        applicationId "com.selfcare.selfcare"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        // Override CMake output to short path to avoid 260-char Windows limit
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cFlags "-DCMAKE_BUILD_TYPE=Debug"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Pin CMake build directory to a short path to avoid the 260-char
    // Windows MAX_PATH limit when generating C++ intermediates under
    // long project paths.
    def cxxBuildRoot = "C:\\tmp\\cxx"
    file(cxxBuildRoot).mkdirs()
    androidComponents {
        beforeVariants(selector().all()) { variant ->
            // Force the C++ intermediates under our short build root
        }
    }

    project.ext.hermesEnabled = true
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("androidx.multidex:multidex:2.0.1")
}
