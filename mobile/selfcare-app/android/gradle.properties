# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true

# CMake build staging directory — short path avoids 260-char Windows limit
cmake.buildStagingDirectory=C:/tmp/cmake_build

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
android.sdk.dir=C:/Users/sangiya/AppData/Local/Android/Sdk

# React Native — disable Hermes and native build to avoid 260-char Windows path limit
newArchEnabled=true
hermesEnabled=false

# Build only x86_64 to match the local Android emulator ABI
reactNativeArchitectures=x86_64
