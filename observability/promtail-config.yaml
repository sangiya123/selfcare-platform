server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/**/*-json.log
    pipeline_stages:
      - docker: {}

  # Application logs from k8s/systemd
  - job_name: omobio
    static_configs:
      - targets:
          - localhost
        labels:
          job: omobio
          __path__: /var/log/omobio/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<level>\w+)\s+\[(?P<tenantId>[^,]+),(?P<correlationId>[^\]]+)\]\s+(?P<logger>\S+)\s+-\s+(?P<message>.*)'
      - labels:
          level:
          tenantId:
          correlationId:
          logger:
      - match:
          selector: '{job="omobio"}'
          stages:
            - template:
                source: message
                template: '{{ .Entry }}'
