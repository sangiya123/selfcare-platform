# =============================================================================
# Jenkins — ConfigMap: CasC configuration
# =============================================================================
{{- if .Values.jenkins.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-jenkins-casc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: selfcare-ci
data:
  jenkins.yaml: |
    {{- .Values.jenkins.cascadeYaml | nindent 4 }}
---
# =============================================================================
# Jenkins — Secret: admin credentials + kubeconfigs
# =============================================================================
{{- if and (not .Values.jenkins.adminExistingSecret) .Values.jenkins.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-jenkins-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: selfcare-ci
type: Opaque
stringData:
  JENKINS_ADMIN_USER: {{ .Values.jenkins.admin.username | quote }}
  JENKINS_ADMIN_PASSWORD: {{ .Values.jenkins.admin.password | quote }}
  DOCKER_REGISTRY_USER: {{ .Values.registry.username | default "" | quote }}
  DOCKER_REGISTRY_PASSWORD: {{ .Values.registry.password | default "" | quote }}
  SONAR_TOKEN: "{{ .Values.sonar.token | default "" }}"
  NVD_API_KEY: "{{ .Values.nvd.apiKey | default "" }}"
  {{- range $k, $v := .Values.jenkins.kubeconfigs }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}