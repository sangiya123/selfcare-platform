# =============================================================================
# SonarQube — Deployment + Service + PVCs + Secret
# =============================================================================
{{- if .Values.sonarqube.enabled }}
# --- Secret: admin password ---
{{- if not .Values.sonarqube.adminExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sonarqube-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/part-of: selfcare-ci
type: Opaque
stringData:
  SONAR_ADMIN_PASSWORD: {{ .Values.sonarqube.admin.password | quote }}
---
{{- end }}
# --- PVCS ---
{{- range $name, $vol := dict "data" .Values.sonarqube.volumes.data "extensions" .Values.sonarqube.volumes.extensions "logs" .Values.sonarqube.volumes.logs }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-sonarqube-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/part-of: selfcare-ci
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ $vol.storageClassName | quote }}
  resources:
    requests:
      storage: {{ $vol.size }}
---
{{- end }}
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/part-of: selfcare-ci
spec:
  type: {{ .Values.sonarqube.service.type }}
  selector:
    app.kubernetes.io/name: sonarqube
  ports:
    - name: http
      port: {{ .Values.sonarqube.service.port }}
      targetPort: http
      protocol: TCP
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/part-of: selfcare-ci
spec:
  replicas: {{ .Values.sonarqube.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarqube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarqube
        app.kubernetes.io/part-of: selfcare-ci
    spec:
      securityContext:
        runAsUser: 0
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: sonarqube
          image: "{{ .Values.sonarqube.image.repository }}:{{ .Values.sonarqube.image.tag }}"
          imagePullPolicy: {{ .Values.sonarqube.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
              value: {{ .Values.sonarqube.esBootstrapChecksDisabled | quote }}
            - name: SONARQUBE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sonarqube.adminExistingSecret | default (printf "%s-sonarqube-credentials" .Release.Name) }}
                  key: SONAR_ADMIN_PASSWORD
          volumeMounts:
            - name: sonar-data
              mountPath: /opt/sonarqube/data
            - name: sonar-extensions
              mountPath: /opt/sonarqube/extensions
            - name: sonar-logs
              mountPath: /opt/sonarqube/logs
          resources:
            {{- toYaml .Values.sonarqube.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: sonar-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-sonarqube-data
        - name: sonar-extensions
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-sonarqube-extensions
        - name: sonar-logs
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-sonarqube-logs
{{- end }}