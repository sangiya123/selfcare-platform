jenkins:
  systemMessage: "Selfcare CI/CD — AEE Flow Matrix pipeline."
  numExecutors: 3
  mode: NORMAL
  quietPeriod: 5
  scmCheckoutRetryCount: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"
  sonarGlobalConfiguration:
    installations:
      - name: "local-sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
          - string:
              scope: GLOBAL
              id: "docker-registry-url"
              secret: "${DOCKER_REGISTRY_URL:-selfcare}"
          - usernamePassword:
              scope: GLOBAL
              id: "docker-registry"
              username: "${DOCKER_REGISTRY_USER:-}"
              password: "${DOCKER_REGISTRY_PASSWORD:-}"
          - string:
              scope: GLOBAL
              id: "github-token"
              secret: "${GITHUB_TOKEN}"
          - string:
              scope: GLOBAL
              id: "argocd-token"
              secret: "${ARGOCD_TOKEN:-}"
          - string:
              scope: GLOBAL
              id: "owasp-nvd-api-key"
              secret: "${OWASP_NVD_API_KEY:-}"
          - string:
              scope: GLOBAL
              id: "sentry-dsn"
              secret: "${SENTRY_DSN:-}"
