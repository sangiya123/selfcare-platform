# Selfcare Platform - APPLICATION STACK (microservices + observability)
#
# LOCAL DEVELOPMENT ONLY. The application deploys to Kubernetes in dev/stg/reg/prod.
# Infrastructure (MongoDB, MySQL, Redis, Kafka, admin UIs) lives in
# docker-compose.infra.yml - start it first:
#
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose up -d                 # this file - application services
#   docker compose logs -f api-gateway   # tail a service
#   docker compose down                  # stop application (infra survives)
#
# Tenant: dialog-lk (Sri Lanka telco). Schema is seeded by the infra compose.

x-selfcare-common: &selfcare-common
  restart: unless-stopped
  environment: &selfcare-env
    # Tenant header that all services require
    X_DEFAULT_TENANT_ID: "dialog-lk"
    SELFCARE_TENANT_DEFAULT_ID: "dialog-lk"
    # SSRF allow list: extend with dev/mock/private hosts that must keep working
    # (operator BSS/SMSC hosts are baked-in defaults; these are the mock + in-cluster)
    SELFCARE_SECURITY_URL_ALLOWLIST_HOSTS: "localhost,host.docker.internal,mock,bss-dialog.svc,smsc-dialog.svc,bss-hutch.svc,smsc-hutch.svc,bss-airtel.svc,smsc-airtel.svc,aia-api.svc"
    # JVM settings (capped heap: 19 services x unrestricted MaxRAMPercentage
    # overcommits the Docker VM and makes every boot thrash for 20+ min)
    JAVA_TOOL_OPTIONS: "-Xmx768m -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    SPRING_PROFILES_ACTIVE: docker
    # MySQL hostnames (infra compose network)
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_USER: selfcare
    DB_USERNAME: selfcare
    DB_PASSWORD: Selfcare_My5ql_Db_Pa55w0rd!2026
    SPRING_JPA_HIBERNATE_DDL_AUTO: update
    JPA_DDL_AUTO: update
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/selfcare_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    # MongoDB hostnames (infra compose network)
    MONGO_HOST: mongodb
    MONGO_PORT: "27017"
    MONGO_USERNAME: selfcare
    MONGO_PASSWORD: Selfcare_M0ng0_Db_Pa55w0rd!2026
    MONGO_DATABASE: selfcare_config
    MONGODB_URI: "mongodb://selfcare:Selfcare_M0ng0_Db_Pa55w0rd!2026@mongodb:27017/selfcare_config?authSource=admin"
    SPRING_MONGODB_URI: "mongodb://selfcare:Selfcare_M0ng0_Db_Pa55w0rd!2026@mongodb:27017/selfcare_config?authSource=admin"
    # Redis connectivity (infra compose network)
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: Selfcare_R3d1s_Pa55w0rd!2026
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    SPRING_DATA_REDIS_PASSWORD: Selfcare_R3d1s_Pa55w0rd!2026
  networks:
    - selfcare-app-net

services:
  # ─────────────────────────────────────────────────────────────
  # SELF-CARE MICROSERVICES (deploy to Kubernetes in prod)
  # ─────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: api-gateway
    container_name: selfcare-api-gateway
    <<: *selfcare-common
    ports:
      - "8080:8080"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8080
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_CONFIG_IMPORT: "optional:configserver:"
    depends_on:
      config-tenant-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  config-tenant-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: config-tenant-service
    container_name: selfcare-config-tenant
    <<: *selfcare-common
    ports:
      - "8081:8081"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8081
      SPRING_MONGODB_URI: mongodb://selfcare:Selfcare_M0ng0_Db_Pa55w0rd!2026@mongodb:27017/selfcare_config?authSource=admin

  customer-identity-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: customer-identity-service
    container_name: selfcare-customer-identity
    <<: *selfcare-common
    ports:
      - "8082:8082"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8082
      DB_NAME: selfcare_identity
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/selfcare_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: selfcare
      SPRING_DATASOURCE_PASSWORD: Selfcare_My5ql_Db_Pa55w0rd!2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: Selfcare_R3d1s_Pa55w0rd!2026

  admin-identity-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: admin-identity-service
    container_name: selfcare-admin-identity
    <<: *selfcare-common
    ports:
      - "8083:8083"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8083
      DB_NAME: selfcare_admin
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/selfcare_admin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: selfcare
      SPRING_DATASOURCE_PASSWORD: Selfcare_My5ql_Db_Pa55w0rd!2026

  account-entitlement-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: account-entitlement-service
    container_name: selfcare-account-entitlement
    <<: *selfcare-common
    ports:
      - "8084:8084"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8084
      DB_NAME: selfcare_core
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/selfcare_core?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: selfcare
      SPRING_DATASOURCE_PASSWORD: Selfcare_My5ql_Db_Pa55w0rd!2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: Selfcare_R3d1s_Pa55w0rd!2026

  dashboard-bff:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: dashboard-bff
    container_name: selfcare-dashboard-bff
    <<: *selfcare-common
    ports:
      - "8085:8085"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8085
    depends_on:
      - config-tenant-service
      - account-entitlement-service

  product-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: product-service
    container_name: selfcare-product
    <<: *selfcare-common
    ports:
      - "8086:8086"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8086

  usage-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: usage-service
    container_name: selfcare-usage
    <<: *selfcare-common
    ports:
      - "8087:8087"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8087
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  support-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: support-service
    container_name: selfcare-support
    <<: *selfcare-common
    ports:
      - "8098:8098"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8098
      SPRING_MONGODB_URI: mongodb://selfcare:Selfcare_M0ng0_Db_Pa55w0rd!2026@mongodb:27017/selfcare_config?authSource=admin

  billing-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: billing-service
    container_name: selfcare-billing
    <<: *selfcare-common
    ports:
      - "8088:8088"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8088

  payment-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: payment-service
    container_name: selfcare-payment
    <<: *selfcare-common
    ports:
      - "8089:8089"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8089
      DB_NAME: selfcare_payment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/selfcare_payment?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: selfcare
      SPRING_DATASOURCE_PASSWORD: Selfcare_My5ql_Db_Pa55w0rd!2026
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  notification-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: notification-service
    container_name: selfcare-notification
    <<: *selfcare-common
    ports:
      - "8090:8090"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8090
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  content-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: content-service
    container_name: selfcare-content
    <<: *selfcare-common
    ports:
      - "8091:8091"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8091
      SPRING_MONGODB_URI: mongodb://selfcare:Selfcare_M0ng0_Db_Pa55w0rd!2026@mongodb:27017/selfcare_config?authSource=admin

  journey-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: journey-service
    container_name: selfcare-journey
    <<: *selfcare-common
    ports:
      - "8092:8092"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8092
      SPRING_MONGODB_URI: mongodb://selfcare:Selfcare_M0ng0_Db_Pa55w0rd!2026@mongodb:27017/selfcare_config?authSource=admin

  reporting-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: reporting-service
    container_name: selfcare-reporting
    <<: *selfcare-common
    ports:
      - "8093:8093"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8093

  ai-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: ai-gateway
    container_name: selfcare-ai-gateway
    <<: *selfcare-common
    ports:
      - "8094:8094"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8094
      # Local AI stub - replace with real API key in production
      SELFCARE_AI_PROVIDER: stub
      SELFCARE_AI_STUB_ENABLED: "true"
      SPRING_MONGODB_URI: mongodb://selfcare:Selfcare_M0ng0_Db_Pa55w0rd!2026@mongodb:27017/selfcare_config?authSource=admin

  audit-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: audit-service
    container_name: selfcare-audit
    <<: *selfcare-common
    ports:
      - "8095:8095"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8095
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  insurance-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: insurance-service
    container_name: selfcare-insurance
    <<: *selfcare-common
    ports:
      - "8096:8096"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8096
      SPRING_MONGODB_URI: mongodb://selfcare:Selfcare_M0ng0_Db_Pa55w0rd!2026@mongodb:27017/selfcare_config?authSource=admin

  approval-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.jarbuild
      args:
        MODULE: approval-service
    container_name: selfcare-approval
    <<: *selfcare-common
    ports:
      - "8097:8097"
    environment:
      <<: *selfcare-env
      SERVER_PORT: 8097

  # ─────────────────────────────────────────────────────────────
  # OBSERVABILITY (local; in prod these are deployed in-cluster)
  # ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: selfcare-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/local/prometheus-alerts.yaml:/etc/prometheus/alerts/prometheus-alerts.yaml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - selfcare-app-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: selfcare-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: Selfcare_Gr4f4n4_Adm1n_Pa55w0rd!2026
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - selfcare-app-net
    depends_on:
      - prometheus

networks:
  selfcare-app-net:
    driver: bridge
    name: selfcare-app-net
    external: false