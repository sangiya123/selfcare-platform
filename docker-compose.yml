# Selfcare Platform - STATEFUL INFRASTRUCTURE ONLY
#
# This compose file holds ONLY stateful infrastructure and database admin
# UIs that must never be exposed to the public cloud:
#   MongoDB, Mongo Express, Redis, MySQL, PHPMyAdmin, Zookeeper, Kafka
#
# NO application microservice lives here. The 19 microservices, the admin
# portal (selfcare-admin), Jenkins, and SonarQube run on Kubernetes and are
# deployed by the Jenkins pipeline (ci/jenkins/Jenkinsfile) using the Helm
# chart backend/deploy/helm.
#
# Usage:
#   docker compose up -d                      # start infra only
#   docker compose down -v                    # tear down (+ volumes)
#   docker compose logs -f kafka              # tail logs
#
# Admin UIs (local convenience only - do NOT publish ports to the internet):
#   Mongo Express : http://localhost:8081  (admin / Selfcare_M0ng0Expr3ss_Pa55w0rd!2026)
#   PHPMyAdmin    : http://localhost:8080  (server: mysql, user: selfcare)
#
# IMPORTANT: infra names/hosts (mongodb, mysql, redis, kafka) are used by
# the microservices running on Kubernetes too - expose this host via an
# in-cluster service or a private network ONLY, never the public internet.

name: selfcare-infra

networks:
  selfcare-infra-net:
    driver: bridge
    name: selfcare-infra-net

volumes:
  infra-mongodb-data:
  infra-redis-data:
  infra-mysql-data:
  infra-jenkins-home:
  infra-jenkins-workspace:
  infra-maven-cache:
  infra-sonarqube-data:
  infra-sonarqube-extensions:
  infra-sonarqube-logs:

services:
  # ─────────────────────────────────────────────────────────────
  # MongoDB  - config source of truth (tenants, layouts, themes,
  #             assets, experiences, journeys)
  # ─────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: selfcare-infra-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-selfcare}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-Selfcare_M0ng0_Db_Pa55w0rd!2026}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-selfcare_config}
    volumes:
      - infra-mongodb-data:/data/db
      - ./deploy/local/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - selfcare-infra-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  # MongoDB admin UI (local only)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: selfcare-infra-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME:-selfcare}:${MONGO_PASSWORD:-Selfcare_M0ng0_Db_Pa55w0rd!2026}@mongodb:27017/${MONGO_DATABASE:-selfcare_config}?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-Selfcare_M0ng0Expr3ss_Pa55w0rd!2026}
    networks:
      - selfcare-infra-net

  # ─────────────────────────────────────────────────────────────
  # Redis - cache / sessions / hot entitlement
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: selfcare-infra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-Selfcare_R3d1s_Pa55w0rd!2026}"]
    volumes:
      - infra-redis-data:/data
    networks:
      - selfcare-infra-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Selfcare_R3d1s_Pa55w0rd!2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # MySQL - transactional data + per-service schemas
  # ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: selfcare-infra-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Selfcare_My5ql_R00t_Pa55w0rd!2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-selfcare_identity}
      MYSQL_USER: ${MYSQL_USERNAME:-selfcare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Selfcare_My5ql_Db_Pa55w0rd!2026}
    volumes:
      - infra-mysql-data:/var/lib/mysql
      - ./deploy/local/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - selfcare-infra-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Selfcare_My5ql_R00t_Pa55w0rd!2026}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MySQL admin UI (local only)
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: selfcare-infra-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USERNAME:-selfcare}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-Selfcare_My5ql_Db_Pa55w0rd!2026}
      UPLOAD_LIMIT: 64M
    networks:
      - selfcare-infra-net

  # ─────────────────────────────────────────────────────────────
  # Kafka + Zookeeper - event streaming / audit fan-out / CDC
  # ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: selfcare-infra-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - selfcare-infra-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 5 localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: selfcare-infra-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - selfcare-infra-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # CI/CD - Jenkins (full SDLC pipeline) + SonarQube (quality gate)
  # Built from ci/jenkins (JDK 25, Maven, Node, Helm, kubectl, docker CLI).
  # Spins in the SAME selfcare-infra network so the pipeline can reach
  # MongoDB/MySQL/Kafka while running builds + security scans.
  # ─────────────────────────────────────────────────────────────
  jenkins:
    build:
      context: ./ci/jenkins
    image: selfcare/jenkins:local
    container_name: selfcare-infra-jenkins
    restart: unless-stopped
    depends_on:
      sonarqube:
        condition: service_started
    ports:
      - "${JENKINS_PORT:-8090}:8080"
      - "50000:50000"
    env_file:
      - ci/.env.ci
    user: root
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dcasc.jenkins.config=/var/jenkins_home/casc_configs/jenkins.yaml
    volumes:
      - infra-jenkins-home:/var/jenkins_home
      - infra-jenkins-workspace:/workspace
      - infra-maven-cache:/var/maven-cache
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - selfcare-infra-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: selfcare-infra-sonarqube
    restart: unless-stopped
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - infra-sonarqube-data:/opt/sonarqube/data
      - infra-sonarqube-extensions:/opt/sonarqube/extensions
      - infra-sonarqube-logs:/opt/sonarqube/logs
    networks:
      - selfcare-infra-net