version: '3.8'

# Observability stack for the Selfcare Platform.
# Brings up OpenTelemetry Collector, Prometheus, Grafana, Jaeger, Loki.
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Endpoints:
#   Grafana:    http://localhost:3000  (admin / Selfcare_Gr4f4n4_Adm1n_Pa55w0rd!2026)
#   Prometheus: http://localhost:9090
#   Jaeger:     http://localhost:16686
#   Loki:       http://localhost:3100

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: selfcare-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
      - "8888:8888"   # Telemetry self
      - "13133:13133" # Health
    environment:
      - env=dev
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: selfcare-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./observability/prometheus-scrape.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: selfcare-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Selfcare_Gr4f4n4_Adm1n_Pa55w0rd!2026
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
      - loki
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: selfcare-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # gRPC
      - "14268:14268"  # HTTP
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: selfcare-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    container_name: selfcare-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail-config.yaml:/etc/promtail/config.yml:ro
    ports:
      - "9080:9080"
    depends_on:
      - loki
    restart: unless-stopped
