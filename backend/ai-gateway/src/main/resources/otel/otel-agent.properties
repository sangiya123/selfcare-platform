#
# OpenTelemetry Java Agent configuration for the selfcare backend services.
#
# Apply by adding to the JVM args when starting the service:
#   -javaagent:/opt/otel/opentelemetry-javaagent.jar
#   -Dotel.service.name=customer-identity-service
#   -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
#
# This file is referenced by the Dockerfile and the Helm chart.

otel.service.name=${OTEL_SERVICE_NAME:ai-gateway}
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
otel.exporter.otlp.protocol=grpc
otel.exporter.otlp.timeout=10000

# Resource attributes
otel.resource.attributes=service.name=${OTEL_SERVICE_NAME:ai-gateway},service.namespace=selfcare,service.version=1.0.0,deployment.environment=${SELFCARE_ENV:dev}

# Trace configuration
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=1.0
otel.traces.exporter=otlp
otel.traces.max.export.batch.size=512

# Metrics
otel.metrics.exporter=otlp
otel.metric.export.interval=30000

# Logs
otel.logs.exporter=otlp

# Auto-instrumentation (Java agent auto-discovers these)
otel.instrumentation.common.default-enabled=true

# Java agent additional config
otel.java.global-autoconfigure.enabled=true
otel.java.experimental.execution.serviceloader.enabled=true
otel.instrumentation.common.experimental.controller-telemetry.enabled=true

# Specific instrumentations
otel.instrumentation.http.enabled=true
otel.instrumentation.jdbc.enabled=true
otel.instrumentation.jms.enabled=true
otel.instrumentation.kafka.enabled=true
otel.instrumentation.lettuce.enabled=true
otel.instrumentation.mongodb.enabled=true
otel.instrumentation.reactor.enabled=true
otel.instrumentation.rxjava.enabled=true
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.spring-webmvc.enabled=true
otel.instrumentation.spring-webflux.enabled=true
otel.instrumentation.servlet.enabled=true

# WebClient instrumentation
otel.instrumentation.spring-webflux-5.0.enabled=true

# AI gateway custom config
otel.instrumentation.ai.enabled=true

# Suppress noisy instrumentations
otel.instrumentation.logback-appender.enabled=false
otel.instrumentation.logback-mdc-1.0.enabled=false

# Performance
otel.bsp.schedule.delay=5000
otel.bsp.max.queue.size=2048
