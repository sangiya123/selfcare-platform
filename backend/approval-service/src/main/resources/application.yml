# selfcare Approval Service
# Four-eyes approval workflow for high-risk admin actions
spring:
  application:
    name: approval-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfcare_approval}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:selfcare}
    password: ${DB_PASSWORD:Selfcare_My5ql_Db_Pa55w0rd!2026}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  mongodb:
    uri: mongodb://${MONGO_USERNAME:selfcare}:${MONGO_PASSWORD:Selfcare_M0ng0_Db_Pa55w0rd!2026}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:selfcare_config}?authSource=admin
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Selfcare_R3d1s_Pa55w0rd!2026}

server:
  port: ${APPROVAL_SERVICE_PORT:8097}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.selfcare: ${LOG_LEVEL:INFO}
  pattern:
    level: "%5p [tenant=%X{tenantId} correlation=%X{correlationId}]"

selfcare:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:selfcare-platform}
      audience: ${JWT_AUDIENCE:selfcare-platform}
  otel:
    enabled: ${OTEL_ENABLED:false}
    service-name: approval-service
    endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
  approval:
    default-expiry-hours: 72
    expiry-check-interval-ms: 300000
