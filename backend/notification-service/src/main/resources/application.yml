# selfcare Notification Service
spring:
  application:
    name: notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfcare_notification}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:selfcare}
    password: ${DB_PASSWORD:Selfcare_My5ql_Db_Pa55w0rd!2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mongodb:
    uri: mongodb://${MONGO_USERNAME:selfcare}:${MONGO_PASSWORD:Selfcare_M0ng0_Db_Pa55w0rd!2026}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:selfcare_config}?authSource=admin
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Selfcare_R3d1s_Pa55w0rd!2026}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

server:
  port: ${NOTIFICATION_SERVICE_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.selfcare: ${LOG_LEVEL:INFO}
  pattern:
    level: "%5p [tenant=%X{tenantId} correlation=%X{correlationId}]"

selfcare:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:selfcare-platform}
      audience: ${JWT_AUDIENCE:selfcare-platform}
  otel:
    enabled: ${OTEL_ENABLED:false}
    service-name: notification-service
    endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
