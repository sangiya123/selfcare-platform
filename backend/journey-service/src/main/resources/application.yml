spring:
  application:
    name: journey-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/selfcare_journey}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

server:
  port: ${SERVER_PORT:8092}

omobio:
  journey:
    instance-ttl-days: 30
    max-steps-per-journey: 50
    default-timeout-seconds: 60
  platform:
    otel:
      enabled: ${OTEL_ENABLED:false}
      service-name: journey-service

logging:
  level:
    com.omobio.journey: ${LOG_LEVEL:INFO}
    org.springframework.data.mongodb: INFO
  pattern:
    level: "%5p [tenant=%X{tenantId} correlation=%X{correlationId}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
