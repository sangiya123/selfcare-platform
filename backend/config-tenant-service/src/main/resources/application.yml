# selfcare Config Tenant Service
spring:
  main:
    web-application-type: servlet
  application:
    name: config-tenant-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mongodb:
    uri: mongodb://${MONGO_USERNAME:selfcare}:${MONGO_PASSWORD:Selfcare_M0ng0_Db_Pa55w0rd!2026}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:selfcare_config}?authSource=admin
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Selfcare_R3d1s_Pa55w0rd!2026}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${CONFIG_TENANT_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.selfcare: ${LOG_LEVEL:INFO}
  pattern:
    level: "%5p [tenant=%X{tenantId} correlation=%X{correlationId}]"

selfcare:
  security:
    # Set to true in dev to bypass JWT auth for /api/v1/admin/** endpoints
    dev-mode-bypass: true
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:selfcare-platform}
      audience: ${JWT_AUDIENCE:selfcare-platform}
  otel:
    enabled: ${OTEL_ENABLED:false}
    service-name: config-tenant-service
    endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
