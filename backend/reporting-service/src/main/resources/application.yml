spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfcare_reporting}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:selfcare}
    password: ${DB_PASSWORD:Selfcare_My5ql_Db_Pa55w0rd!2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: report-exec-

server:
  port: ${SERVER_PORT:8093}

selfcare:
  reporting:
    output-dir: ${REPORT_OUTPUT_DIR:/tmp/reports}
    max-rows-per-report: 1000000
    csv-separator: ","
  platform:
    otel:
      enabled: ${OTEL_ENABLED:false}
      service-name: reporting-service

logging:
  level:
    com.selfcare.reporting: ${LOG_LEVEL:INFO}
    org.springframework.scheduling: INFO
  pattern:
    level: "%5p [tenant=%X{tenantId} correlation=%X{correlationId}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
