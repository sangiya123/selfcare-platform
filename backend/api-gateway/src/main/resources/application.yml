                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            # ==========================================================
            # STRANGLER-FIG FALLBACK (Legacy PHP for unmigrated paths)
            # ==========================================================

            - id: legacy-php-fallback
              uri: ${LEGACY_PHP_URL:http://legacy-php.local:80}
              predicates:
                - Path=/legacy/**
              filters:
                - name: TenantRouting
                - StripPrefix=1
                # No rate limiter for legacy — PHP app handles its own throttling
                # No circuit breaker — PHP fallback is best-effort

  # WebFlux base path is /; the gateway itself listens on the root context
  webflux:
    base-path: /

  # ================================================================
  # REDIS — required for Spring Cloud Gateway RequestRateLimiter
  # ================================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Selfcare_R3d1s_Pa55w0rd!2026}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 5
          max-wait: 1s

# ================================================================
# selfcare PLATFORM CONFIG
# ================================================================
selfcare:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:${CUSTOMER_IDENTITY_URL:http://customer-identity-service:8081}/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:selfcare-platform}
      audience: ${JWT_AUDIENCE:selfcare-platform}
      # Enable for local development to generate an ephemeral key pair.
      # Tokens from customer-identity and admin-identity will NOT validate
      # unless they also use the same key (only for local testing).
      local-key:
        enabled: ${JWT_LOCAL_KEY_ENABLED:false}
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:*}
  # WAF Configuration
  # WAF_ENABLED=true activates OWASP ModSecurity-inspired rules from waf-rules.yml
  # In production, consider running the actual ModSecurity sidecar (CRS) or a
  # cloud-managed WAF (Cloud Armor, AWS WAF, etc.) instead of this inline filter.
  waf:
    enabled: ${WAF_ENABLED:false}
    rules-file: classpath:waf-rules.yml
    block-on-match: true
    log-only-mode: false
    # Per-IP request body size (bytes) - enforced regardless of WAF_ENABLED
    max-body-size-bytes: 1048576
    # Per-IP request rate limit (window/seconds, max requests)
    default-rate-limit:
      window-seconds: 60
      max-requests: 300
  featureflags:
    provider: ${FEATUREFLAG_PROVIDER:noop}
  otel:
    enabled: ${OTEL_ENABLED:false}
    service-name: api-gateway
    endpoint: ${OTEL_ENDPOINT:http://localhost:4317}
  discovery:
    provider: ${SELFCARE_DISCOVERY_PROVIDER:eureka}

# ================================================================
# RESILIENCE4J
# ================================================================
resilience4j:
  circuitbreaker:
    instances:
      dashboardBff:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.server.ResponseStatusException
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      dashboardBff:
        timeoutDuration: 5s
        cancelRunningFuture: true
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
    configs:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

# ================================================================
# MANAGEMENT & OBSERVABILITY
# ================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

# ================================================================
# SERVER
# ================================================================
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  netty:
    connection-timeout: 5000

# ================================================================
# LOGGING
# ================================================================
logging:
  level:
    com.selfcare: ${LOG_LEVEL:INFO}
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
  pattern:
    level: "%5p [tenant=%X{tenantId} correlation=%X{correlationId}]"

# ================================================================
# FALLBACK — rendered when the dashboard-bff circuit breaker is open.
# The /fallback path is served by this gateway itself.
# Note: mvc.static-path-pattern is needed because Spring Boot
# WebFlux does not auto-configure static resources by default.
# ================================================================
mvc:
  static-path-pattern: /fallback/**

---
# ==================================================================
# DEVELOPMENT PROFILE OVERRIDES
# ==================================================================
spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: localhost
      port: 6379

selfcare:
  discovery:
    provider: eureka
  security:
    jwt:
      jwks-uri: http://localhost:8081/.well-known/jwks.json
      local-key:
        enabled: true