                - StripPrefix=0

            - id: content-service
              uri: ${CONTENT_SERVICE_URL:http://content-service:8091}
              predicates:
                - Path=/api/v1/content/**,/api/v1/articles/**,/api/v1/faqs/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 500
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: journey-service
              uri: ${JOURNEY_SERVICE_URL:http://journey-service:8092}
              predicates:
                - Path=/api/v1/journeys/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: reporting-service
              uri: ${REPORTING_SERVICE_URL:http://reporting-service:8093}
              predicates:
                - Path=/api/v1/reports/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: ai-gateway
              uri: ${AI_GATEWAY_URL:http://ai-gateway:8094}
              predicates:
                - Path=/api/v1/ai/**,/api/v1/assistant/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://audit-service:8095}
              predicates:
                - Path=/api/v1/audit/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 400
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: approval-service
              uri: ${APPROVAL_SERVICE_URL:http://approval-service:8097}
              predicates:
                - Path=/api/v1/admin/approvals/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
