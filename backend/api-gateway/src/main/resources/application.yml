# selfcare API Gateway — Base Configuration
# Profile is activated by SELFCARE_ENV -> SPRING_PROFILES_ACTIVE
# Environment-specific overrides live in application-{dev,stg,reg,prod}.yml

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive

  cloud:
    gateway:
      # NOTE: Spring Cloud Gateway 5.x binds gateway config under the
      #       spring.cloud.gateway.server.webflux.* prefix. The legacy
      #       spring.cloud.gateway.routes prefix is NO LONGER MIGRATED
      #       (Gateway 5 removed GatewayServerWebfluxPropertiesMigrationListener),
      #       so routes below MUST stay under server -> webflux.

      server:
        webflux:
          # ------------------------------------------------------------
          # Global CORS — allows all origins for SPA / mobile clients.
          # Specific operator CORS policies are enforced at config-tenant-service.
          # ------------------------------------------------------------
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                exposedHeaders:
                  - X-Correlation-Id
                  - X-Tenant-Id
                  - X-Config-Version
                allowCredentials: true
                maxAge: 3600

          # ------------------------------------------------------------
          # Service discovery — auto-routes for unregistered services.
          # Explicit routes below are preferred; this is the fallback.
          # ------------------------------------------------------------
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
              predicates:
                - name: Path
                  args:
                    pattern: "/{service}/**"
              filters:
                - RewritePath="/{service}/(?<segment>.*)", "/$\{segment}"

          # ------------------------------------------------------------
          # Default filters applied to ALL routes.
          # GlobalFilter beans (JwtRateLimitExclusionFilter,
          # JwtAuthenticationHeaderRelay) are registered automatically and
          # run before per-route filters.
          # ------------------------------------------------------------
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin
            - name: Waf
              args:
                enabled: ${WAF_ENABLED:false}

          # ------------------------------------------------------------
          # Route definitions
          # Filter order per route (top to bottom):
          #   1. TenantRouting         — tenant validation + header propagation
          #   2. RequestRateLimiter    — Redis-backed rate limiting (see redis config)
          #   3. CircuitBreaker        — resilience4j circuit breaker (dashboard-bff only)
          #   4. StripPrefix=0         — path is passed as-is to downstream
          # ------------------------------------------------------------
          routes:

            # ==========================================================
            # IDENTITY SERVICES
            # ==========================================================

            - id: customer-identity
              uri: ${CUSTOMER_IDENTITY_URL:http://customer-identity-service:8082}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: TenantRouting
                # Auth endpoints are EXCLUDED from rate limiting by
                # JwtRateLimitExclusionFilter (global), not by the resolver here,
                # because the resolver cannot know the path before routing.
                # The exclusion filter short-circuits Redis token consumption.
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: admin-identity
              uri: ${ADMIN_IDENTITY_URL:http://admin-identity-service:8083}
              predicates:
                - Path=/api/v1/admin/auth/**,/api/v1/admin/users/**,/api/v1/admin/settings/auth/**,/api/v1/admin/mfa/**,/api/v1/admin/roles/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            # ==========================================================
            # ADMIN CONFIG FAMILY (config-tenant-service hosts these)
            # ==========================================================

            - id: admin-config
              uri: ${CONFIG_TENANT_URL:http://config-tenant-service:8081}
              predicates:
                - Path=/api/v1/admin/tenants/**,/api/v1/admin/themes/**,/api/v1/admin/pages/**,/api/v1/admin/feature-flags/**,/api/v1/admin/integrations/**,/api/v1/admin/navigation/**,/api/v1/admin/assets/**,/api/v1/admin/product-mapping/**,/api/v1/admin/components/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 500
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: admin-ai
              uri: ${AI_GATEWAY_URL:http://ai-gateway:8094}
              predicates:
                - Path=/api/v1/admin/ai/**,/api/v1/admin/ai-governance/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: admin-audit
              uri: ${AUDIT_SERVICE_URL:http://audit-service:8095}
              predicates:
                - Path=/api/v1/admin/audit/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 400
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: admin-content
              uri: ${CONTENT_SERVICE_URL:http://content-service:8091}
              predicates:
                - Path=/api/v1/admin/content/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 500
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: admin-journey
              uri: ${JOURNEY_SERVICE_URL:http://journey-service:8092}
              predicates:
                - Path=/api/v1/admin/journeys/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: admin-reports
              uri: ${REPORTING_SERVICE_URL:http://reporting-service:8093}
              predicates:
                - Path=/api/v1/admin/reports/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: admin-token-policy
              uri: ${CUSTOMER_IDENTITY_URL:http://customer-identity-service:8082}
              predicates:
                - Path=/api/v1/admin/token-policy/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            # ==========================================================
            # EXPERIENCE / CONFIG
            # ==========================================================

            - id: config-tenant
              uri: ${CONFIG_TENANT_URL:http://config-tenant-service:8081}
              predicates:
                - Path=/api/v1/config/**,/api/v1/themes/**,/api/v1/layouts/**,/api/v1/admin/feature-flags/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 500
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            # ==========================================================
            # ACCOUNT / ENTITLEMENT
            # ==========================================================

            - id: account-entitlement
              uri: ${ACCOUNT_ENTITLEMENT_URL:http://account-entitlement-service:8084}
              predicates:
                - Path=/api/v1/accounts/**,/api/v1/connections/**,/api/v1/entitlements/**,/api/v1/me/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 300
                    redis-rate-limiter.burstCapacity: 600
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            # ==========================================================
            # BFF — DASHBOARD
            # ==========================================================

            - id: dashboard-bff
              uri: ${DASHBOARD_BFF_URL:http://dashboard-bff:8085}
              predicates:
                - Path=/api/v1/dashboard/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 500
                    redis-rate-limiter.burstCapacity: 1000
                    key-resolver: "#{@tenantKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: dashboardBff
                    fallbackUri: forward:/fallback/dashboard
                - StripPrefix=0

            # ==========================================================
            # CAPABILITY SERVICES
            # ==========================================================

            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://product-service:8086}
              predicates:
                - Path=/api/v1/products/**,/api/v1/catalog/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 400
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: usage-service
              uri: ${USAGE_SERVICE_URL:http://usage-service:8087}
              predicates:
                - Path=/api/v1/usage/**,/api/v1/balance/**,/api/v1/credit-limit/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 400
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: support-service
              uri: ${SUPPORT_SERVICE_URL:http://support-service:8098}
              predicates:
                - Path=/api/v1/support/**
              filters:
                - name: TenantRouting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@tenantKeyResolver}"
                - StripPrefix=0

            - id: billing-service
              uri: ${BILLING_SERVICE_URL:http://billing-service:8088}
              predicates:
                - Path=/api/v1/bills/**,/api/v1/invoices/**
              filters:
