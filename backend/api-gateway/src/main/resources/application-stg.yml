# STAGING profile overrides
spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "https://admin.stg.omobio.io"
            allowedMethods: GET,POST,PUT,DELETE,PATCH,OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

omobio:
  security:
    jwt:
      jwks-uri: ${CUSTOMER_IDENTITY_URL:http://customer-identity}/.well-known/jwks.json
  # WAF enabled in staging for testing (log-only mode first)
  waf:
    enabled: true
    log-only-mode: true
    block-on-match: false
  otel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

logging:
  level:
    com.omobio: INFO
    org.springframework.cloud.gateway: WARN
