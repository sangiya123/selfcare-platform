{{- range $name, $svc := .Values.services }}
{{- $render := include "selfcare.renderService" (dict "name" $name "Values" $.Values) }}
{{- if eq $render "true" }}
{{- $svcObj := merge (deepCopy $.Values.defaultService) $svc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "selfcare.labels" $ | nindent 4 }}
    {{- include "selfcare.serviceLabels" (dict "name" $name "tenant" $svcObj.tenant "industry" $svcObj.industry "tier" $svcObj.tier) | nindent 4 }}
  annotations:
    checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
spec:
  {{- if not $.Values.deploy.isolated }}
  replicas: {{ $svcObj.replicas | default $.Values.autoscaling.minReplicas | default 1 }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "selfcare.selectorLabels" (dict "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "selfcare.serviceLabels" (dict "name" $name "tenant" $svcObj.tenant "industry" $svcObj.industry "tier" $svcObj.tier) | nindent 8 }}
        {{- if $.Values.observability.prometheus.enabled }}
        {{ $.Values.observability.prometheus.podMonitorSelector | default "metrics" }}: "true"
        {{- end }}
      {{- if or $.Values.istio.injection.enabled $.Values.linkerd.injection.enabled }}
      annotations:
        {{- if $.Values.istio.injection.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
        {{- if $.Values.linkerd.injection.enabled }}
        linkerd.io/inject: enabled
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
        {{- if $svcObj.securityContext }}
        {{- toYaml $svcObj.securityContext | nindent 8 }}
        {{- end }}
      {{- if $.Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecret }}
      {{- end }}
      {{- if $svcObj.priorityClassName }}
      priorityClassName: {{ $svcObj.priorityClassName }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "selfcare.image" (dict "name" $name "value" $svcObj "Values" $.Values) | quote }}
          imagePullPolicy: {{ $svcObj.image.pullPolicy | default $.Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ $svcObj.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: selfcare-config-behavior
            - secretRef:
                name: selfcare-infra-creds
            {{- if $svcObj.envFrom }}
            {{- toYaml $svcObj.envFrom | nindent 12 }}
            {{- end }}
          env:
            {{- if $svcObj.port }}
            - name: SERVER_PORT
              value: {{ $svcObj.port | quote }}
            {{- end }}
            - name: SELF_SERVICE
              value: {{ $name | quote }}
            {{- include "selfcare.sharedEnv" $ | indent 12 }}
            {{- $mergedEnv := merge (deepCopy $.Values.defaultService.env) $svcObj.env }}
            {{- range $ek, $ev := $mergedEnv }}
            - name: {{ $ek | quote }}
              value: {{ $ev | quote }}
            {{- end }}
          {{- if $svcObj.startupProbe }}
          startupProbe:
            httpGet:
              path: {{ $svcObj.startupProbe.path | default "/actuator/health" }}
              port: http
            periodSeconds: {{ $svcObj.startupProbe.periodSeconds | default 10 }}
            failureThreshold: {{ $svcObj.startupProbe.failureThreshold | default 30 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $svcObj.livenessProbe.path | default "/actuator/health" }}
              port: http
            initialDelaySeconds: {{ $svcObj.livenessProbe.initialDelaySeconds | default 60 }}
            periodSeconds: {{ $svcObj.livenessProbe.periodSeconds | default 15 }}
            timeoutSeconds: {{ $svcObj.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ $svcObj.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ $svcObj.readinessProbe.path | default "/actuator/health" }}
              port: http
            initialDelaySeconds: {{ $svcObj.readinessProbe.initialDelaySeconds | default 20 }}
            periodSeconds: {{ $svcObj.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $svcObj.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ $svcObj.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- if $svcObj.resources }}
            {{- toYaml $svcObj.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: {{ $.Values.resources.requests.cpu | default "250m" }}
              memory: {{ $.Values.resources.requests.memory | default "512Mi" }}
            limits:
              cpu: {{ $.Values.resources.limits.cpu | default "1000m" }}
              memory: {{ $.Values.resources.limits.memory | default "1Gi" }}
            {{- end }}
          {{- with $svcObj.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $svcObj.sidecars }}
        {{- toYaml $svcObj.sidecars | nindent 8 }}
        {{- end }}
      {{- with $svcObj.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.topologySpreadZone | and (not $.Values.deploy.isolated) }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ $.Values.topologySpreadZone }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "selfcare.selectorLabels" (dict "name" $name) | nindent 14 }}
      {{- end }}
      {{- if and $.Values.tolerations (not $.Values.deploy.isolated) }}
      tolerations:
        {{- toYaml $.Values.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}