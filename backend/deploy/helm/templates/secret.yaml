{{/*
 OMOBIO Secrets — references only. Actual values are injected via:
   - AWS Secrets Manager / Vault (production)
   - Kubernetes secrets (bootstrap)
   - External Secrets Operator

 Never put real secrets in this chart or its values files.
*/}}
{{- if .Values.enabled | default true }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omobio.fullname" . }}-secrets
  namespace: {{ include "omobio.namespace" . }}
  labels:
    {{- include "omobio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.jwtSigningKey }}
  jwt-signing-key: {{ .Values.secrets.jwtSigningKey }}
  {{- end }}
  {{- if .Values.secrets.databasePassword }}
  db-password: {{ .Values.secrets.databasePassword }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword }}
  {{- end }}
  {{- if .Values.secrets.kafkaCredentials }}
  kafka-credentials: {{ .Values.secrets.kafkaCredentials }}
  {{- end }}
{{- end }}
