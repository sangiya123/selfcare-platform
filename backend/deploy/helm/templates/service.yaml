{{- if .Values.enabled | default true }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "omobio.fullname" . }}
  namespace: {{ include "omobio.namespace" . }}
  labels:
    {{- include "omobio.labels" . | nindent 4 }}
    app.omobio.io/service: {{ include "omobio.name" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.service.extraPorts }}
    {{- toYaml .Values.service.extraPorts | nindent 4 }}
    {{- end }}
  selector:
    {{- include "omobio.selectorLabels" . | nindent 4 }}
  sessionAffinity: None
  publishNotReadyAddresses: false
{{- end }}
