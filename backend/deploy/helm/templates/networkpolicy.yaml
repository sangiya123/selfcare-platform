{{- if .Values.networkPolicy.enabled }}
{{- range $name, $svc := .Values.services }}
{{- $render := include "selfcare.renderService" (dict "name" $name "Values" $.Values) }}
{{- if eq $render "true" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "selfcare.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      {{- include "selfcare.selectorLabels" (dict "name" $name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Allow intra-namespace traffic
        - podSelector: {}
        # Allow API gateway ingress (port 8080)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: {{ $svc.port | default 8080 }}
  egress:
    - {}  # Allow all egress (MongoDB, MySQL, Redis, Kafka, external APIs)
{{- end }}
{{- end }}
{{- end }}