# Default values for omobio-microservice chart
# Override per service via -f <service>-values.yaml
# Override per operator via -f operator-values/operator-<name>-values.yaml

replicaCount: 2

image:
  repository: omobio/api-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: omobio-registry-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Application configuration
env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx768m -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
  OTEL_SERVICE_NAME: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

# Tenant configuration
tenant:
  id: ""
  operator: ""

# Probes
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Service-specific secrets (referenced from Kubernetes secret)
secrets:
  # Secret references only — values injected at runtime
  jwtSigningKey: ""
  databasePassword: ""
  redisPassword: ""
  kafkaCredentials: ""

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Argo Rollouts canary
rollout:
  enabled: false
  canary:
    steps:
      - setWeight: 10
      - pause: { duration: 5m }
      - setWeight: 25
      - pause: { duration: 5m }
      - setWeight: 50
      - pause: { duration: 5m }
      - setWeight: 100

# Network policies
networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  ingressPodSelector: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
