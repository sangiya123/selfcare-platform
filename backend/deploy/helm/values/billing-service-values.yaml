# billing-service-values.yaml — Billing Service overrides
# Handles: invoicing, payment collection, billing cycles, revenue recognition
# Higher resources and retry config for financial operations

replicaCount: 3

image:
  repository: omobio/billing-service

resources:
  limits:
    cpu: 2000m
    memory: 2.5Gi
  requests:
    cpu: 500m
    memory: 1.5Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 70

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx2g -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Billing cycle settings
  BILLING_CYCLE_DAY: "1"
  BILLING_CYCLE_CRON: "0 0 1 1 * *"
  # Invoice generation settings
  INVOICE_GENERATION_BATCH_SIZE: "100"
  INVOICE_PDF_STORAGE_PATH: "/data/invoices"
  # Retry configuration for payment failures
  PAYMENT_RETRY_MAX_ATTEMPTS: "5"
  PAYMENT_RETRY_INITIAL_DELAY_MS: "60000"
  PAYMENT_RETRY_MULTIPLIER: "2.0"
  PAYMENT_RETRY_MAX_DELAY_MS: "3600000"
  # Revenue recognition settings
  REVENUE_RECOGNITION_ENABLED: "true"
  REVENUE_RECOGNITION_CRON: "0 0 2 * * *"
  # Payment gateway integration
  PAYMENT_GATEWAY_RETRY_ENABLED: "true"
  PAYMENT_GATEWAY_TIMEOUT_SECONDS: "30"
  # Late payment grace period (days)
  LATE_PAYMENT_GRACE_PERIOD_DAYS: "7"
  # Dunning process settings
  DUNNING_ENABLED: "true"
  DUNNING_CRON: "0 0 9 * * *"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8088
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8088
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"
  paymentGatewayApiKey: "secret-ref:payment-gateway-api-key"
  paymentGatewayMerchantId: "secret-ref:payment-gateway-merchant-id"
  paymentGatewaySecret: "secret-ref:payment-gateway-secret"

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
