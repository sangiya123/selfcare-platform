# admin-identity-values.yaml — Admin Identity Service overrides
# Handles: admin user authentication, RBAC, role management

replicaCount: 2

image:
  repository: omobio/admin-identity-service

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx768m -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Admin session TTL
  ADMIN_SESSION_TTL_MINUTES: "480"
  # Role cache TTL
  ROLE_CACHE_TTL_MINUTES: "30"
  # Permission cache TTL
  PERMISSION_CACHE_TTL_MINUTES: "15"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8082
  initialDelaySeconds: 40
  periodSeconds: 10
  failureThreshold: 4

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8082
  initialDelaySeconds: 20
  periodSeconds: 5
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"
  jwtSigningKey: "secret-ref:jwt-signing-key"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
