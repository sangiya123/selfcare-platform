# config-tenant-values.yaml — Config & Tenant Service overrides
# Handles: tenant configuration, runtime feature toggles, dynamic settings

replicaCount: 2

image:
  repository: omobio/config-tenant-service

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx768m -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Config refresh interval (5 minutes)
  CONFIG_REFRESH_INTERVAL_SECONDS: "300"
  # Tenant settings cache TTL
  TENANT_CACHE_TTL_SECONDS: "120"
  # Feature flag refresh interval
  FEATURE_FLAG_REFRESH_SECONDS: "60"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8083
  initialDelaySeconds: 40
  periodSeconds: 10
  failureThreshold: 4

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8083
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
