# product-service-values.yaml — Product Service overrides
# Handles: product catalog, pricing, inventory, offers, discounts

replicaCount: 2

image:
  repository: omobio/product-service

resources:
  limits:
    cpu: 1200m
    memory: 1.5Gi
  requests:
    cpu: 350m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Product catalog cache TTL (15 minutes)
  PRODUCT_CACHE_TTL_MINUTES: "15"
  # Pricing cache TTL (5 minutes)
  PRICING_CACHE_TTL_MINUTES: "5"
  # Inventory cache TTL (30 seconds for real-time stock)
  INVENTORY_CACHE_TTL_SECONDS: "30"
  # Search index refresh interval
  SEARCH_INDEX_REFRESH_SECONDS: "300"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8086
  initialDelaySeconds: 45
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8086
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
