# customer-identity-values.yaml — Customer Identity Service overrides
# Handles: OTP, OIDC, JWT issuance, JWKS endpoint

replicaCount: 2

image:
  repository: omobio/customer-identity-service

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 15

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx768m -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  JWT_ACCESS_TOKEN_TTL_DAYS: "42"
  JWT_REFRESH_TOKEN_TTL_DAYS: "210"
  OTP_CODE_LENGTH: "6"
  OTP_EXPIRY_SECONDS: "300"
  OTP_MAX_ATTEMPTS: "3"
  SESSION_CACHE_TTL_MINUTES: "60"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 45
  periodSeconds: 10
  failureThreshold: 4

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 5
  failureThreshold: 3

secrets:
  jwtSigningKey: "secret-ref:jwt-signing-key"
  databasePassword: "secret-ref:db-password"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
