# prod environment overrides (immutable, HA, strictest gates)
environment:
  name: prod
  profiles: prod

image:
  tag: ""  # Must be pinned by Jenkins release (e.g. v1.2.3) — never latest

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCpu: 70
  targetMemory: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

ingress:
  enabled: true
  host: selfcare.example.com
  adminHost: admin.selfcare.example.com
  rateLimit: "100"
  waf: true
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

observability:
  logLevel: WARN
  tracing:
    enabled: true
    endpoint: http://otel-collector:4317
  prometheus:
    enabled: true
    podMonitorSelector: app.kubernetes.io/name
    scrapeInterval: 15s

istio:
  injection:
    enabled: true

# Production resource profile (typical per 1Gi heap service)
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi