# notification-service-values.yaml — Notification Service overrides
# Handles: multi-channel notifications (SMS, email, push), templating, delivery tracking

replicaCount: 3

image:
  repository: omobio/notification-service

resources:
  limits:
    cpu: 1500m
    memory: 1.5Gi
  requests:
    cpu: 400m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 65

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Notification dispatcher thread pool
  DISPATCHER_CORE_POOL_SIZE: "20"
  DISPATCHER_MAX_POOL_SIZE: "100"
  DISPATCHER_QUEUE_CAPACITY: "5000"
  # Template cache TTL
  TEMPLATE_CACHE_TTL_MINUTES: "60"
  # Retry policy
  NOTIFICATION_MAX_RETRIES: "3"
  NOTIFICATION_RETRY_DELAY_MS: "5000"
  # Enable/disable channels
  NOTIFICATION_SMS_ENABLED: "true"
  NOTIFICATION_EMAIL_ENABLED: "true"
  NOTIFICATION_PUSH_ENABLED: "true"
  # Batching settings
  NOTIFICATION_BATCH_SIZE: "50"
  NOTIFICATION_BATCH_INTERVAL_MS: "1000"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8090
  initialDelaySeconds: 50
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8090
  initialDelaySeconds: 25
  periodSeconds: 10
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"
  smsProviderApiKey: "secret-ref:sms-provider-api-key"
  smtpUsername: "secret-ref:smtp-username"
  smtpPassword: "secret-ref:smtp-password"
  firebaseServiceAccount: "secret-ref:firebase-service-account"

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
