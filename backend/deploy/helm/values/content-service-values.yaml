# content-service-values.yaml — Content Service overrides
# Handles: CMS content, media assets, content versioning, CDN sync

replicaCount: 2

image:
  repository: omobio/content-service

resources:
  limits:
    cpu: 1500m
    memory: 2Gi
  requests:
    cpu: 400m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx1536m -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Content cache TTL
  CONTENT_CACHE_TTL_MINUTES: "30"
  # Media upload max size (100MB)
  MEDIA_MAX_UPLOAD_SIZE_MB: "100"
  # CDN base URL for asset serving
  CDN_BASE_URL: "https://cdn.omobio.example.com"
  # Thumbnail generation settings
  THUMBNAIL_GENERATION_ENABLED: "true"
  # Content versioning
  ENABLE_CONTENT_VERSIONING: "true"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8091
  initialDelaySeconds: 50
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8091
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"
  cdnApiKey: "secret-ref:cdn-api-key"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
