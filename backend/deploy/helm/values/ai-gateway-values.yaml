# ai-gateway-values.yaml — AI Gateway Service overrides
# Handles: AI model serving, LLM routing, prompt orchestration, model inference
# Higher memory limits required for model serving; WebFlux for reactive streaming

replicaCount: 3

image:
  repository: omobio/ai-gateway-service

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx6g -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # WebFlux tuning for reactive AI streaming
  WEBFLUX_WORKER_POOL_SIZE: "32"
  WEBFLUX_MAX_MEMORY_SIZE_MB: "16"
  # AI model serving settings
  AI_MODEL_CACHE_TTL_MINUTES: "30"
  AI_MODEL_WARMUP_ENABLED: "true"
  # LLM request settings
  LLM_REQUEST_TIMEOUT_SECONDS: "60"
  LLM_MAX_TOKENS: "4096"
  LLM_TEMPERATURE: "0.7"
  # Token bucket rate limit
  AI_RATE_LIMIT_TOKENS_PER_MINUTE: "100000"
  # Concurrent request limit per pod
  AI_MAX_CONCURRENT_REQUESTS: "50"
  # Streaming response buffer size
  AI_STREAM_BUFFER_SIZE_KB: "64"
  # Circuit breaker for LLM providers
  AI_CIRCUIT_BREAKER_FAILURE_RATE: "0.5"
  AI_CIRCUIT_BREAKER_WAIT_DURATION_MS: "30000"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8094
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8094
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"
  openaiApiKey: "secret-ref:openai-api-key"
  anthropicApiKey: "secret-ref:anthropic-api-key"
  modelRegistryToken: "secret-ref:model-registry-token"

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
