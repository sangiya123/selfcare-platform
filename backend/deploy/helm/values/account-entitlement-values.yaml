# account-entitlement-values.yaml — Account Entitlement Service overrides
# Handles: plan subscriptions, feature entitlements, quota management

replicaCount: 2

image:
  repository: omobio/account-entitlement-service

resources:
  limits:
    cpu: 1000m
    memory: 1.5Gi
  requests:
    cpu: 300m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Entitlement cache TTL (5 minutes for real-time accuracy)
  ENTITLEMENT_CACHE_TTL_SECONDS: "300"
  # Plan cache TTL (1 hour)
  PLAN_CACHE_TTL_MINUTES: "60"
  # Feature toggle cache TTL
  FEATURE_TOGGLE_CACHE_TTL_SECONDS: "60"
  # Quota check batch size
  QUOTA_CHECK_BATCH_SIZE: "100"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8084
  initialDelaySeconds: 45
  periodSeconds: 10
  failureThreshold: 4

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8084
  initialDelaySeconds: 20
  periodSeconds: 5
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
