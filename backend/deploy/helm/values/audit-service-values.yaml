# audit-service-values.yaml — Audit Service overrides
# Handles: audit logging, compliance events, immutable audit trail
# Append-only storage to ensure tamper-evident records

replicaCount: 2

image:
  repository: omobio/audit-service

resources:
  limits:
    cpu: 1000m
    memory: 1.5Gi
  requests:
    cpu: 300m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxRAMPercentage=75.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # Append-only storage enforcement
  AUDIT_IMMUTABLE_MODE: "true"
  AUDIT_NO_DELETE_ALLOWED: "true"
  # Audit event buffer size
  AUDIT_BUFFER_SIZE: "1000"
  AUDIT_FLUSH_INTERVAL_MS: "1000"
  # Retention period (compliance - 7 years)
  AUDIT_RETENTION_YEARS: "7"
  # Event signing for tamper detection
  AUDIT_SIGNING_ENABLED: "true"
  AUDIT_SIGNATURE_ALGORITHM: "SHA256withRSA"
  # Async processing for performance
  AUDIT_ASYNC_PROCESSING: "true"
  AUDIT_ASYNC_POOL_SIZE: "10"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8095
  initialDelaySeconds: 40
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8095
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

secrets:
  databasePassword: "secret-ref:db-password"
  auditSigningKey: "secret-ref:audit-signing-key"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true

# Ingress annotations for audit log access (restricted)
ingress:
  annotations:
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "audit-ui-auth"
    nginx.ingress.kubernetes.io/limit-rps: "10"
