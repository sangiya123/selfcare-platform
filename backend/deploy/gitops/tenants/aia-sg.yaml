# tenant config: aia-sg
# Client: AIA Singapore — INSURANCE INSURER
# Region: SG
# Industry: INSURANCE
# Tenant Type: INSURER
# Created by: OMOBIO Platform Team

env:
  # Tenant identity
  TENANT_ID: aia-sg
  TENANT_OPERATOR: aia
  TENANT_INDUSTRY: INSURANCE
  TENANT_TYPE: INSURER
  TENANT_REGION: SG
  TENANT_DISPLAY_NAME: "AIA Singapore"
  TENANT_COUNTRY: Singapore

  # Contact and support
  TENANT_SUPPORT_EMAIL: support@aia.sg
  TENANT_SUPPORT_PHONE: "+65-XXXX-XXXX"

  # Branding
  TENANT_BRAND_COLOR_PRIMARY: "#D9001B"
  TENANT_BRAND_COLOR_SECONDARY: "#FFFFFF"
  TENANT_BRAND_LOGO_URL: "https://assets.omobio.example/brands/aia-sg/logo.svg"
  TENANT_BRAND_FAVICON: "https://assets.omobio.example/brands/aia-sg/favicon.ico"

  # Domain configuration
  TENANT_DOMAIN: aia.com.sg
  TENANT_CDN_DOMAIN: "cdn.aia.com.sg"
  TENANT_INGRESS_HOST: "selfcare.aia.com.sg"

  # Industry-specific provider endpoints (Insurance)
  INSURANCE_API_URL: "https://api.aia.com.sg/insurance/v1"
  INSURANCE_API_KEY_REF: "secret-ref:aia-sg-insurance-api-key"
  POLICY_API_URL: "https://api.aia.com.sg/policy/v1"
  CLAIMS_API_URL: "https://api.aia.com.sg/claims/v1"
  AGENT_PORTAL_URL: "https://agents.aia.com.sg"
  KYC_PROVIDER_URL: "https://kyc.aia.com.sg/v1"

  # Feature flags (insurance-specific)
  POLICY_VIEW_ENABLED: true
  PREMIUM_CALCULATION_ENABLED: true
  CLAIM_FILING_ENABLED: true
  CLAIM_TRACKING_ENABLED: true
  BENEFICIARY_MANAGEMENT_ENABLED: true
  RENEWAL_REMINDER_ENABLED: true
  AI_ASSISTANT_ENABLED: true
  JOURNEY_ENABLED: true
  DOCUMENT_UPLOAD_ENABLED: true
  INVESTMENT_LINKED_POLICIES_ENABLED: true
  TELEMEDICINE_ENABLED: true
  OTP_METHODS:
    - SMS
    - EMAIL
    - BIOMETRIC
  SUPPORTED_LANGUAGES:
    - en
    - zh
    - ms
    - ta

  # Compliance (Singapore MAS regulations)
  DATA_RETENTION_DAYS: 1095
  GDPR_COMPLIANT: true
  PDPA_COMPLIANT: true
  MAS_REGULATED: true
  INSURANCE_REGULATOR_NOTIFY_DAYS: 14

  # Resource sizing
  RESOURCE_QUOTA_CPU_REQUEST: "1000m"
  RESOURCE_QUOTA_MEMORY_REQUEST: "1Gi"
  RESOURCE_QUOTA_CPU_LIMIT: "4000m"
  RESOURCE_QUOTA_MEMORY_LIMIT: "4Gi"
