spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfcare_audit}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      concurrency: 3

server:
  port: ${SERVER_PORT:8095}

omobio:
  audit:
    retention-days: 365
    max-export-rows: 100000
  platform:
    otel:
      enabled: ${OTEL_ENABLED:false}
      service-name: audit-service

logging:
  level:
    com.omobio.audit: ${LOG_LEVEL:INFO}
    org.springframework.kafka: INFO
  pattern:
    level: "%5p [tenant=%X{tenantId} correlation=%X{correlationId}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
